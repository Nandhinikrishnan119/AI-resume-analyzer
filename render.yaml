services:
  - type: web
    name: resume-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://resume-ai-frontend.onrender.com
      - key: JWT_SECRET_KEY
        generateValue: true

  - type: web
    name: resume-ai-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://resume-ai-backend.onrender.com/api